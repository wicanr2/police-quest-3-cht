name: build-macos

# 《警察故事3》繁中化 — macOS universal(arm64 + x86_64) ScummVM.app。
#
# 為什麼要用 runner：.app 只能在 macOS host 上組（codesign / hdiutil / iconutil 都是
# macOS 限定），Linux 端做不出來。
#
# [HARD] ScummVM 的 configure 不是 autoconf，CXXFLAGS/LDFLAGS 只能當環境變數餵，
#        塞成 configure 參數會噴 "integer expression expected"。
# [HARD] CXXFLAGS 一律帶 -fstack-protector-strong。前例：GfxFontChinese 的堆疊緩衝區
#        溢位 48 bytes，clang/arm64 預設開 stack protector 才擋下來；Linux/Windows
#        當時沒開，同一份溢位靜靜跑過去、三平台測試全綠。三平台都開，這類 bug 才會
#        在第一個踩到的人身上就炸，而不是挑平台炸。
# [HARD] 不用 brew 的 sdl2（2026 起是 sdl2-compat shim，runtime 才 dlopen libSDL3，
#        dylibbundler 抓不到，玩家端黑畫面）。改自源碼編 pinned 真 SDL2。
# [HARD] MT-32（Munt）一律編入 —— configure 不帶 --disable-mt32emu。ROM 有版權不隨包
#        分發，所以只開能力、不設預設驅動；玩家自備 ROM 放遊戲夾後於音效選項選 MT-32。
#
# universal 用「每弧各編一次 + lipo -create」，不用單次雙 -arch 塞給 configure
# （autoconf 風格的版本解析在雙弧下會炸）。

on:
  workflow_dispatch:
  push:
    tags: ['v*-macos']

env:
  SDL_VER: "2.30.9"
  MIN_OS: "11.0"
  # SCI-only 精簡：關掉所有外部媒體/格式/網路庫（mt32emu 不在此列，保持啟用）。
  # 理由：scummvm-static 對這些庫要 MacPorts 式的靜態 .a，runner 沒有；而 brew 的 .a
  # 是 arm64-only，x86_64 弧走 Rosetta 連進去會架構不符。
  # PQ3 只需要 SDL2（自編 universal）＋ 內建 nuked-opl（AdLib）＋ 內建 mt32emu（Munt）
  # ＋ 自帶的 Big5 字型，不需要 freetype/vorbis/png。
  LEAN_FLAGS: >-
    --disable-ogg --disable-vorbis --disable-tremor --disable-flac --disable-mad
    --disable-faad --disable-mpcdec --disable-openmpt --disable-mikmod
    --disable-fluidsynth --disable-fluidlite --disable-sonivox
    --disable-theoradec --disable-vpx --disable-mpeg2 --disable-a52
    --disable-png --disable-jpeg --disable-gif --disable-freetype2 --disable-fribidi
    --disable-zlib --disable-libcurl --disable-cloud --disable-enet --disable-sdlnet
    --disable-discord --disable-sparkle --disable-lua
    --disable-tts --disable-taskbar --disable-system-dialogs --disable-system-printing

jobs:
  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 下載 SDL2 原始碼（pinned，避開 brew 的 sdl2-compat shim）
        run: |
          curl -fsSL -o "$RUNNER_TEMP/SDL2.tar.gz" \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VER}/SDL2-${SDL_VER}.tar.gz"

      - name: 自編 SDL2 — arm64（native）
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sdl-build-arm64" && mkdir -p "$RUNNER_TEMP/sdl-build-arm64"
          tar xf "$RUNNER_TEMP/SDL2.tar.gz" -C "$RUNNER_TEMP/sdl-build-arm64" --strip-components=1
          cd "$RUNNER_TEMP/sdl-build-arm64"
          export CFLAGS="-arch arm64 -mmacosx-version-min=${MIN_OS}"
          export CXXFLAGS="$CFLAGS" LDFLAGS="$CFLAGS"
          ./configure --prefix="$RUNNER_TEMP/sdl-arm64" --without-x
          make -j"$(sysctl -n hw.ncpu)"
          make install
          # 防呆：真 SDL2 約 2MB，shim 約 0.5MB；再用 otool 確認沒有 SDL3 依賴
          SIZE=$(stat -f%z "$RUNNER_TEMP/sdl-arm64/lib/libSDL2-2.0.0.dylib")
          echo "arm64 libSDL2 size=$SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo "### 疑似 shim，體積過小 ###"; exit 1; }
          otool -L "$RUNNER_TEMP/sdl-arm64/lib/libSDL2-2.0.0.dylib" | grep -qi SDL3 && { echo "### 混入 SDL3 依賴 ###"; exit 1; } || true

      - name: 自編 SDL2 — x86_64（arch -x86_64 走 Rosetta，configure 內部 run-test 需要）
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/sdl-build-x86_64" && mkdir -p "$RUNNER_TEMP/sdl-build-x86_64"
          tar xf "$RUNNER_TEMP/SDL2.tar.gz" -C "$RUNNER_TEMP/sdl-build-x86_64" --strip-components=1
          cd "$RUNNER_TEMP/sdl-build-x86_64"
          arch -x86_64 /bin/bash -c "
            set -euo pipefail
            export CFLAGS='-arch x86_64 -mmacosx-version-min=${MIN_OS}'
            export CXXFLAGS=\"\$CFLAGS\" LDFLAGS=\"\$CFLAGS\"
            ./configure --prefix='$RUNNER_TEMP/sdl-x86_64' --without-x
            make -j\"\$(sysctl -n hw.ncpu)\"
            make install
          "
          SIZE=$(stat -f%z "$RUNNER_TEMP/sdl-x86_64/lib/libSDL2-2.0.0.dylib")
          echo "x86_64 libSDL2 size=$SIZE bytes"
          [ "$SIZE" -gt 1000000 ] || { echo "### 疑似 shim，體積過小 ###"; exit 1; }
          otool -L "$RUNNER_TEMP/sdl-x86_64/lib/libSDL2-2.0.0.dylib" | grep -qi SDL3 && { echo "### 混入 SDL3 依賴 ###"; exit 1; } || true

      - name: clone pinned ScummVM + 套中文化 patch（兩份獨立 checkout，避免共用 build 目錄互汙）
        run: |
          set -euo pipefail
          UPSTREAM="$(cat patches/UPSTREAM_COMMIT.txt)"
          echo ">> pinned upstream: $UPSTREAM"
          # core.autocrlf=false / core.eol=lf：避免 CRLF 轉換讓 patch -p1 套不上
          git clone --config core.autocrlf=false --config core.eol=lf \
            https://github.com/scummvm/scummvm.git "$RUNNER_TEMP/scummvm-arm64"
          git -C "$RUNNER_TEMP/scummvm-arm64" fetch --depth 1 origin "$UPSTREAM" \
            || git -C "$RUNNER_TEMP/scummvm-arm64" fetch origin
          git -C "$RUNNER_TEMP/scummvm-arm64" checkout -f "$UPSTREAM"
          bash tools/apply_patches.sh "$RUNNER_TEMP/scummvm-arm64"
          rm -rf "$RUNNER_TEMP/scummvm-x86_64"
          cp -a "$RUNNER_TEMP/scummvm-arm64" "$RUNNER_TEMP/scummvm-x86_64"

      - name: 補 mt32emu vendor 標頭（pinned 樹若缺 audio/softsynth/mt32/config.h）
        run: |
          set -euo pipefail
          UPSTREAM="$(cat patches/UPSTREAM_COMMIT.txt)"
          for D in "$RUNNER_TEMP/scummvm-arm64" "$RUNNER_TEMP/scummvm-x86_64"; do
            F="$D/audio/softsynth/mt32/config.h"
            if [ ! -s "$F" ]; then
              echo ">> 補回 $F"
              mkdir -p "$(dirname "$F")"
              curl -sfL "https://raw.githubusercontent.com/scummvm/scummvm/$UPSTREAM/audio/softsynth/mt32/config.h" -o "$F"
            fi
          done

      - name: configure + make scummvm-static — arm64
        working-directory: ${{ runner.temp }}/scummvm-arm64
        run: |
          set -euo pipefail
          export CXXFLAGS="-arch arm64 -mmacosx-version-min=${MIN_OS} -fstack-protector-strong"
          export LDFLAGS="$CXXFLAGS"
          ./configure --disable-all-engines --enable-engine=sci --disable-detection-full \
            --enable-release $LEAN_FLAGS --with-sdl-prefix="$RUNNER_TEMP/sdl-arm64"
          # configure 找不到東西時不會報錯，只會安靜把選項註解掉 → 收尾一定要反查
          grep -qi "^ENABLE_SCI" config.mk    || { echo "### sci engine 未編入(arm64) ###"; exit 12; }
          grep -q "^SDL_BACKEND = 1" config.mk || { echo "### SDL 未偵測到(arm64) ###"; exit 13; }
          grep -q "^USE_MT32EMU = 1" config.mk || { echo "### mt32emu 未編入(arm64) ###"; exit 14; }
          make -j"$(sysctl -n hw.ncpu)" scummvm-static

      - name: configure + make scummvm-static — x86_64（Rosetta）
        working-directory: ${{ runner.temp }}/scummvm-x86_64
        run: |
          set -euo pipefail
          arch -x86_64 /bin/bash -c "
            set -euo pipefail
            export CXXFLAGS='-arch x86_64 -mmacosx-version-min=${MIN_OS} -fstack-protector-strong'
            export LDFLAGS=\"\$CXXFLAGS\"
            ./configure --disable-all-engines --enable-engine=sci --disable-detection-full \
              --enable-release $LEAN_FLAGS --with-sdl-prefix='$RUNNER_TEMP/sdl-x86_64'
            grep -qi '^ENABLE_SCI' config.mk     || { echo '### sci engine 未編入(x86_64) ###'; exit 12; }
            grep -q '^SDL_BACKEND = 1' config.mk || { echo '### SDL 未偵測到(x86_64) ###'; exit 13; }
            grep -q '^USE_MT32EMU = 1' config.mk || { echo '### mt32emu 未編入(x86_64) ###'; exit 14; }
            make -j\"\$(sysctl -n hw.ncpu)\" scummvm-static
          "

      - name: lipo 合併 universal，make bundle 組 ScummVM.app
        working-directory: ${{ runner.temp }}/scummvm-arm64
        run: |
          set -euo pipefail
          lipo -create \
            "${{ runner.temp }}/scummvm-arm64/scummvm-static" \
            "${{ runner.temp }}/scummvm-x86_64/scummvm-static" \
            -output scummvm-static-universal
          lipo -info scummvm-static-universal | grep -q "arm64"
          lipo -info scummvm-static-universal | grep -q "x86_64"
          make bundle
          # bundle-pack 塞進去的是 arm64-only 的 binary，換成 universal 版本
          cp scummvm-static-universal ScummVM.app/Contents/MacOS/scummvm
          chmod 755 ScummVM.app/Contents/MacOS/scummvm

      - name: lipo 合併 SDL2 dylib，修正 install_name，ad-hoc 簽章
        working-directory: ${{ runner.temp }}/scummvm-arm64
        run: |
          set -euo pipefail
          APP=ScummVM.app
          BIN="$APP/Contents/MacOS/scummvm"
          mkdir -p "$APP/Contents/Frameworks"
          FW="$APP/Contents/Frameworks/libSDL2-2.0.0.dylib"
          lipo -create \
            "$RUNNER_TEMP/sdl-arm64/lib/libSDL2-2.0.0.dylib" \
            "$RUNNER_TEMP/sdl-x86_64/lib/libSDL2-2.0.0.dylib" \
            -output "$FW"
          install_name_tool -id "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" "$FW"
          install_name_tool -change "$RUNNER_TEMP/sdl-arm64/lib/libSDL2-2.0.0.dylib"  "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" "$BIN" || true
          install_name_tool -change "$RUNNER_TEMP/sdl-x86_64/lib/libSDL2-2.0.0.dylib" "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" "$BIN" || true
          install_name_tool -change "@rpath/libSDL2-2.0.0.dylib"                       "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" "$BIN" || true
          codesign --force --sign - "$FW"
          codesign --force --deep --sign - "$APP"

          echo "=== 驗證：主程式與 SDL2 都要雙弧 ==="
          lipo -info "$BIN" | grep -q arm64 && lipo -info "$BIN" | grep -q x86_64
          lipo -info "$FW"  | grep -q arm64 && lipo -info "$FW"  | grep -q x86_64
          echo "=== 驗證：無殘留 build 期絕對路徑 ==="
          if otool -L "$BIN" | grep -E "$RUNNER_TEMP|/Users/runner"; then
            echo "### 仍有 build 期依賴殘留 ###"; exit 1
          fi
          echo OK

      - name: 注入中文資料 + 引擎指紋
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/scummvm-arm64/ScummVM.app"
          DEST="$APP/Contents/Resources/cht-data"
          mkdir -p "$DEST"
          # 凡 dist-cht/ 有的都要注入 —— 用清單反查，不要只挑幾個檔（漏一個中文資料
          # 就會出現「其他平台好好的、只有 macOS 少東西」這種最難查的狀態）
          for f in dist-cht/*; do cp "$f" "$DEST/"; done
          for f in dist-cht/*; do
            b="$(basename "$f")"
            [ -f "$DEST/$b" ] || { echo "### 缺件：$b ###"; exit 1; }
          done
          # [HARD] 指紋要由 CI 從實際編出這顆 binary 的樹算，不可本機補算
          ENGINE_SRC="$RUNNER_TEMP/scummvm-arm64" bash tools/engine_fingerprint.sh > "$DEST/ENGINE.txt"
          echo "engine fingerprint: $(cat "$DEST/ENGINE.txt")"
          ls -la "$DEST"

      - name: 打包
        run: |
          set -euo pipefail
          mkdir -p dist-macos
          cd "$RUNNER_TEMP/scummvm-arm64"
          # 啟動器是 .app 旁邊的一支 .command，不動 bundle 的啟動機制：
          # script 當 bundle 進入點 / 改過的 Info.plist / codesign --deep 對混合結構，
          # 任何一環出問題，Finder 雙擊都是靜默失敗，玩家只能回報「沒反應」。
          cat > 玩－警察故事3－中文版.command <<'LAUNCH'
#!/bin/bash
cd "$(dirname "$0")"
read -r -p "請輸入 Police Quest 3 遊戲資料夾路徑：" GAMEDIR
exec ./ScummVM.app/Contents/MacOS/scummvm \
  --path="$GAMEDIR" \
  --extrapath="$PWD/ScummVM.app/Contents/Resources/cht-data" \
  --auto-detect --language=tw
LAUNCH
          chmod +x 玩－警察故事3－中文版.command
          cat > 修復－macOS.command <<'FIX'
#!/bin/bash
cd "$(dirname "$0")"
xattr -cr ScummVM.app && codesign --force --deep --sign - ScummVM.app
echo "已移除隔離屬性並重新簽章，可以開啟 ScummVM.app 了。"
FIX
          chmod +x 修復－macOS.command
          tar czf "$GITHUB_WORKSPACE/dist-macos/PQ3-CHT-patch-macos-universal.tar.gz" \
            ScummVM.app 玩－警察故事3－中文版.command 修復－macOS.command

      - name: 驗收（patch 版絕不可含遊戲資源）
        run: |
          set -euo pipefail
          T=dist-macos/PQ3-CHT-patch-macos-universal.tar.gz
          if tar tzf "$T" | grep -iE 'RESOURCE\.[0-9M]|\.DRV$|\.EXE$|\.ROM$|\.V56$'; then
            echo "### patch 包含遊戲資源，違反 patch-only ###"; exit 1
          fi
          tar tzf "$T" | grep -q 'cht-data/translation.tsv'
          tar tzf "$T" | grep -q 'cht-data/pq3_big5.fnt'
          tar tzf "$T" | grep -q 'cht-data/pq3_big5_hi.fnt'
          tar tzf "$T" | grep -q 'cht-data/ENGINE.txt'
          echo OK

      - uses: actions/upload-artifact@v4
        with:
          name: pq3-cht-macos-universal
          path: dist-macos/*
